name: Integration Tests

on:
  schedule:
    - cron: '0 4 * * 1'   # Weekly, Monday 04:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  fts-postgres:
    name: FTS on PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run FTS E2E tests (PostgreSQL 17 via Testcontainers)
        run: mvn test -Dtest="FtsHttpE2ETest,FtsServiceTest" -Dfts.integration=true -Dflyway.skip=false

  oidc-keycloak:
    name: OIDC on Keycloak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OIDC E2E tests (Keycloak 26.2 via Testcontainers)
        run: mvn test -Dtest="OidcKeycloakE2ETest" -Doidc.integration=true
