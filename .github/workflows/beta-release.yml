name: Beta Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Create a beta pre-release from develop'
        required: true
        default: 'yes'

permissions:
  contents: write
  packages: write

jobs:
  beta:
    name: Beta Release
    runs-on: ubuntu-latest
    # Only run after the CI workflow succeeds (tests + quality checks)
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Generate beta tag
        id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          DATE=$(date -u +%Y%m%d)
          TAG="v${PROJECT_VERSION}-beta.${DATE}.${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Beta tag: $TAG"

      - name: Build fat JAR
        run: mvn package -DskipTests -Dflyway.skip=true -q

      - name: Rename fat JAR
        env:
          BETA_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FAT=$(find runary-web/target/ -name "runary-*-fat.jar" | head -1)
          cp "$FAT" "runary-web/target/runary-${BETA_TAG}.jar"

      - name: Create beta release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Runary ${{ steps.tag.outputs.tag }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ## Beta Release

            Automated beta build from `develop` branch.

            **Commit:** ${{ github.sha }}
            **Version:** ${{ steps.version.outputs.version }}

            > This is a pre-release. For stable releases, see tags without `-beta`.

            ### Quick start
            ```bash
            # Fat JAR (requires Java 21+)
            RUNARY_QUICKSTART=true java -jar runary-${{ steps.tag.outputs.tag }}.jar

            # Docker
            docker run -p 9999:8080 -e RUNARY_QUICKSTART=true ghcr.io/rygel/runary:beta
            ```
          files: |
            runary-web/target/runary-${{ steps.tag.outputs.tag }}.jar

  # ── Docker beta image — multi-arch, pushed to ghcr.io ─────────────────
  docker-beta:
    name: Docker Beta Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
